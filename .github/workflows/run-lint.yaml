name: Lint

on:
  pull_request:
    branches: [main, stage]
    paths:
      - '**.js'
      - '**.cjs'
      - '**.mjs'
      - '**.css'
      - '.stylelintrc.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/run-lint.yaml'

permissions:
  contents: read

jobs:
  run-lint:
    name: Running eslint and stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --prefer-offline

      - name: Run ESLint on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA" -- '*.js' '*.cjs' '*.mjs' > "$RUNNER_TEMP/changed-js-files"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-js-files"
          if [ "${#files[@]}" -gt 0 ]; then
            npx eslint -- "${files[@]}"
          fi

      - name: Run Stylelint on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA" -- '*.css' > "$RUNNER_TEMP/changed-css-files"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-css-files"
          if [ "${#files[@]}" -gt 0 ]; then
            npx stylelint -- "${files[@]}"
          fi
