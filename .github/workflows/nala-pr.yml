name: Run Nala Tests

on:
  push:
    branches:
      - stage
      - main
  pull_request:
    branches:
      - stage
      - main
    types: [opened, synchronize, reopened]
  
  workflow_dispatch:

jobs:
  run-nala-tests:
    name: Running Nala E2E UI Tests
    runs-on: ubuntu-latest
    # Hung steps would otherwise hold the PR check for GitHub's 6-hour default.
    timeout-minutes: 15
    # Browsers and their OS dependencies come preinstalled in the official
    # Playwright image, so the job no longer runs `playwright install
    # --with-deps` against the runner OS. That step broke every run when
    # ubuntu-latest moved to 26.04 (unsupported by Playwright 1.56), and the
    # container makes the runner's OS irrelevant. The tag MUST match
    # @playwright/test in package-lock.json; the verify step fails fast if not.
    # --user 1001 is the image's non-root user (Firefox refuses to run as root
    # under GitHub's container HOME).
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Verify container browsers match @playwright/test
        # Fails in seconds (instead of every test failing on launch) when a
        # @playwright/test bump lands without bumping the container image tag.
        run: |
          missing=0
          for dir in $(npx playwright install --dry-run | awk '/Install location:/ {print $3}'); do
            [ -d "$dir" ] || { echo "::error::Missing browser $dir"; missing=1; }
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Container image does not match @playwright/test $(npx playwright --version). Bump the mcr.microsoft.com/playwright tag in nala-pr.yml."
            exit 1
          fi

      - name: Set execute permission for nalarun.sh
        run: chmod +x ./nala/utils/pr.run.sh

      - name: Run Nala Tests via pr.run.sh
        run: ./nala/utils/pr.run.sh
        env:
          labels: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          branch: ${{ github.event.pull_request.head.ref }}
          repoName: ${{ github.repository }}
          prUrl: ${{ github.event.pull_request.head.repo.html_url }}
          prOrg: ${{ github.event.pull_request.head.repo.owner.login }}
          prRepo: ${{ github.event.pull_request.head.repo.name }}
          prBranch: ${{ github.event.pull_request.head.ref }}
          prBaseBranch: ${{ github.event.pull_request.base.ref }}
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
          IMS_PASS: ${{ secrets.IMS_PASS }}
